name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    branches:
      - development

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Render authoritative 125A branding
        shell: pwsh
        run: |
          $magick = Get-Command magick -ErrorAction SilentlyContinue
          if (-not $magick) {
            choco install imagemagick.app -y --no-progress
            $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
            $magick = Get-Command magick -ErrorAction SilentlyContinue
          }
          if (-not $magick) { throw "ImageMagick 'magick' command not available" }

          $src = "src/resource/125A_Logo_Master_FINAL.svg"
          $dst = "src/resource/125A_Logo.png"
          & $magick.Source -background none -density 300 $src -resize 128x64 $dst
          if ($LASTEXITCODE -ne 0) { throw "Logo rendering failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path $dst)) { throw "Rendered branding PNG not found: $dst" }

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Midiator and tests
        shell: pwsh
        run: cmake --build build --config Release --target Midiator MidiatorCoreTests MidiatorMeasure MidiatorTriggerTests MidiatorUIContractTests MidiatorStateRoundtripTests MidiatorProcessorLiveTests --parallel

      - name: Run core tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Build Steinberg Validator
        run: cmake --build build --config Release --target validator --parallel

      - name: Validate Midiator
        shell: pwsh
        run: |
          $validator = Get-ChildItem -Path build -Recurse -File -Filter validator.exe | Select-Object -First 1
          if (-not $validator) { throw "Steinberg validator.exe not found" }
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter Midiator.vst3 | Where-Object { Test-Path (Join-Path $_.FullName "Contents") } | Select-Object -First 1
          if (-not $plugin) { throw "Midiator.vst3 bundle not found for validation" }
          & $validator.FullName $plugin.FullName
          if ($LASTEXITCODE -ne 0) { throw "Steinberg validator failed with exit code $LASTEXITCODE" }

      - name: Generate measurement report
        shell: pwsh
        run: |
          .\\build\\tests\\Release\\MidiatorMeasure.exe | Tee-Object -FilePath midiator-measurements.txt

      - name: Upload measurement report
        uses: actions/upload-artifact@v5
        with:
          name: Midiator-Measurements
          path: midiator-measurements.txt
          if-no-files-found: error

      - name: Locate Midiator VST3 bundle
        shell: pwsh
        run: |
          $artifact = "$env:GITHUB_WORKSPACE\artifact"
          New-Item -ItemType Directory -Force -Path $artifact | Out-Null
          $bundles = Get-ChildItem "$env:GITHUB_WORKSPACE\build" -Recurse -Directory -Filter "Midiator.vst3" -ErrorAction SilentlyContinue
          $p = $bundles | Where-Object { Test-Path (Join-Path $_.FullName "Contents") } | Select-Object -First 1
          if (-not $p) { throw "Midiator.vst3 bundle not found" }
          Copy-Item $p.FullName "$artifact\Midiator.vst3" -Recurse -Force

      - name: Upload Midiator VST3
        uses: actions/upload-artifact@v5
        with:
          name: Midiator-Windows-VST3
          path: artifact
          if-no-files-found: error
